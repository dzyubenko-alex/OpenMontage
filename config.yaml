# OpenMontage - Global Configuration

llm:
  provider: anthropic            # anthropic | openai | gemini | openrouter | ollama | mistral | minimax
  model: null                    # null = use provider default
  temperature: 0.7
  max_tokens: 4096

budget:
  mode: warn                     # observe | warn | cap
  total_usd: 10.00
  reserve_pct: 0.10              # holdback for retries / cleanup
  single_action_approval_usd: 0.50
  require_approval_for_new_paid_tool: true

checkpoint:
  policy: guided                 # guided | manual_all | auto_noncreative
  storage_dir: pipeline          # relative to project root

output:
  default_format: mp4
  default_codec: libx264
  default_audio_codec: aac
  default_resolution: "1920x1080"
  default_fps: 30
  default_crf: 23

paths:
  pipeline_dir: pipeline
  library_dir: library
  styles_dir: styles
  skills_dir: skills
  output_dir: output

object_workspace:
  standard_id: OBJECT_WORKSPACE_STANDARD_V1
  canonical_root_pattern: "<OBJECT_CODE>_<SHORT_ADDRESS>"
  openmontage_directory: 06_OpenMontage
  require_explicit_existing_root: true
  allow_automatic_root_creation: false
  allow_legacy_root: true
  required_directories:
    - 01_Фото
    - 02_Видео
    - 03_Документы
    - 04_Описание
    - 05_Реклама
    - 06_OpenMontage/01_Project
    - 06_OpenMontage/02_Preview/Audio
    - 06_OpenMontage/02_Preview/MusicCompare
    - 06_OpenMontage/02_Preview/Video
    - 06_OpenMontage/03_Output/16x9
    - 06_OpenMontage/03_Output/9x16
    - 06_OpenMontage/03_Output/Avito
    - 06_OpenMontage/04_Reports
    - 06_OpenMontage/05_Archive
